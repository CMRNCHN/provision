[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provision"
version = "0.5.0"
description = "An automated tool for employee onboarding tasks, including account creation and data import."
authors = [
  { name="Cameron Cohen", email="cameron@example.com" },
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "selenium>=4.15.0",
    "msal>=1.20.0",
    "tkinterdnd2-universal>=0.5.1; sys_platform == 'darwin'",
    "customtkinter>=6.0.0",
    "sqlcipher3>=0.6.0",
]

[project.urls]
"Homepage" = "https://github.com/CMRNCHN/provision"
"Bug Tracker" = "https://github.com/CMRNCHN/provision/issues"

[project.scripts]
provision = "run:main"

[project.optional-dependencies]
dev = ["pyinstaller"]

[tool.setuptools]
py-modules = [
    "run",
    "gui",
    "onboarding",
    "integrations",
    "bw_import_converter",
    "transaction_db",
    "data_retention",
    "employee_profiles",
    "audit_logger",
    "account_automation",
    "chrome_ops_profile",
    "hq_template",
    "secure_delete",
]
